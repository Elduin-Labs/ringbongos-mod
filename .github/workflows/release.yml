# Runs when a version tag is pushed (e.g. v1.0.0).
#
# Always: builds the mod and attaches the jar to a GitHub Release, so the tag is
# useful even before Modrinth exists.
#
# Additionally publishes to Modrinth, but ONLY if the repo variable
# MODRINTH_PROJECT_ID is set. Without it the Modrinth step is skipped with a
# loud warning rather than silently succeeding and uploading nothing:
#   gh variable set MODRINTH_PROJECT_ID --repo <owner>/<repo> --body "<id>"

name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - uses: gradle/actions/setup-gradle@v4

      - name: Build
        run: ./gradlew build --stacktrace

      - name: Collect the release jar
        id: jar
        run: |
          jar=$(ls build/libs/*.jar | grep -Ev -- '-(sources|javadoc|dev|shadow)\.jar$' | head -1)
          echo "path=$jar" >> "$GITHUB_OUTPUT"
          echo "Release jar: $jar"

      - name: Attach the jar to the GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ steps.jar.outputs.path }}
          body_path: CHANGELOG.md

      - name: Is Modrinth configured?
        id: check
        run: |
          if [ -n "${{ vars.MODRINTH_PROJECT_ID }}" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::warning::MODRINTH_PROJECT_ID is not set — skipping Modrinth. The jar is on the GitHub Release instead."
          fi

      - name: Publish to Modrinth
        if: steps.check.outputs.ready == 'true'
        uses: Kira-NT/mc-publish@v3.3.1
        with:
          modrinth-id: ${{ vars.MODRINTH_PROJECT_ID }}
          modrinth-token: ${{ secrets.MODRINTH_TOKEN }}
          files: ${{ steps.jar.outputs.path }}
          name: ${{ github.ref_name }}
          version: ${{ github.ref_name }}
          version-type: release
          changelog-file: CHANGELOG.md
          game-versions: "1.21.11"
          loaders: fabric
          java: 21
