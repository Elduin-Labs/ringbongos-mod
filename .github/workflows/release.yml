# Two ways in:
#
#  1. Push a version tag (v1.0.0) -> builds, attaches the jar to a GitHub
#     Release, and publishes the version to Modrinth.
#  2. Run "Release" manually from the Actions tab -> preflight only. Checks the
#     Modrinth credentials and project id without publishing anything. Use this
#     after rotating the token.
#
# Credentials:
#   secrets.MODRINTH_TOKEN     - organization secret, inherited by every repo
#   vars.MODRINTH_PROJECT_ID   - per-repo variable, set once per mod
#
# No personal access key is needed on anyone's machine. Everything below runs
# from the org secret.

name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  preflight:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Modrinth credentials and project are usable
        env:
          TOKEN: ${{ secrets.MODRINTH_TOKEN }}
          PID: ${{ vars.MODRINTH_PROJECT_ID }}
        run: |
          fail=0
          if [ -z "$TOKEN" ]; then echo "::error::MODRINTH_TOKEN is empty (org secret missing)"; fail=1; fi
          if [ -z "$PID" ]; then echo "::error::MODRINTH_PROJECT_ID is empty (repo variable missing)"; fail=1; fi
          [ "$fail" = 1 ] && exit 1

          code=$(curl -s -o /tmp/u.json -w '%{http_code}' -H "Authorization: $TOKEN" \
                 -A 'Elduin-Labs/release-preflight' https://api.modrinth.com/v2/user)
          if [ "$code" != "200" ]; then echo "::error::Token rejected by Modrinth (HTTP $code)"; exit 1; fi
          echo "Token authenticates as: $(python3 -c 'import json;print(json.load(open("/tmp/u.json"))["username"])')"

          code=$(curl -s -o /tmp/p.json -w '%{http_code}' -H "Authorization: $TOKEN" \
                 -A 'Elduin-Labs/release-preflight' "https://api.modrinth.com/v2/project/$PID")
          if [ "$code" != "200" ]; then echo "::error::Project $PID not found (HTTP $code)"; exit 1; fi
          python3 - <<'PY'
          import json
          p = json.load(open("/tmp/p.json"))
          print(f"Project: {p['title']} ({p['slug']})  status={p['status']}  versions={len(p.get('versions',[]))}")
          PY
          # One-way fingerprint so we can tell WHICH token this is without
          # ever revealing it. Lets us confirm CI does not depend on anybody's
          # personal key.
          echo "Token fingerprint: $(printf '%s' "$TOKEN" | shasum -a 256 | cut -c1-12)"
          echo "Preflight OK - a version tag will publish to Modrinth."

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - uses: gradle/actions/setup-gradle@v4

      - name: Build
        run: ./gradlew build --stacktrace

      - name: Find the release jar
        id: jar
        run: |
          jar=$(ls build/libs/*.jar | grep -Ev -- '-(sources|javadoc|dev|shadow)\.jar$' | head -1)
          [ -z "$jar" ] && { echo "::error::no release jar in build/libs"; exit 1; }
          echo "path=$jar" >> "$GITHUB_OUTPUT"
          echo "Release jar: $jar"

      - name: Attach the jar to the GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ steps.jar.outputs.path }}
          body_path: CHANGELOG.md

      - name: Can we publish to Modrinth?
        id: check
        run: |
          if [ -n "${{ vars.MODRINTH_PROJECT_ID }}" ] && [ -n "${{ secrets.MODRINTH_TOKEN }}" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::warning::MODRINTH_PROJECT_ID or MODRINTH_TOKEN missing - jar is on the GitHub Release only."
          fi

      - name: Publish to Modrinth
        if: steps.check.outputs.ready == 'true'
        uses: Kira-NT/mc-publish@v3.3.1
        with:
          modrinth-id: ${{ vars.MODRINTH_PROJECT_ID }}
          modrinth-token: ${{ secrets.MODRINTH_TOKEN }}
          files: ${{ steps.jar.outputs.path }}
          name: Ring Bong OS ${{ github.ref_name }}
          version: ${{ github.ref_name }}
          version-type: release
          changelog-file: CHANGELOG.md
          game-versions: "1.21.11"
          game-version-filter: none
          loaders: fabric
          java: 21
          # Set explicitly rather than inferred from fabric.mod.json, so a
          # manifest change can never silently drop the dependency.
          modrinth-dependencies: |
            P7dR8mSH(required)
          modrinth-featured: true
          retry-attempts: 2
          fail-mode: fail
